[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woodelf_explainer" # The PyPi package name
dynamic = ["version"]
description = "Fast explainability algorithms for tree ensembles"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Ron Wettenstein", email = "ron-wettenstein@gmail.com" }
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "treelite>=4.0"
]

[tool.setuptools.dynamic]
version = { attr = "woodelf.__version__" }

[project.optional-dependencies]
# Everything any woodelf flow can reach for: shap parses the models treelite cannot and backs the
# expected_value and shap.Explanation interop, scikit-learn and matplotlib back the partial dependence display.
full = [
    "shap",
    "scikit-learn",
    "matplotlib"
]

test = [
    "pytest",
    "xgboost>=2.0",
    "lightgbm",
    "scikit-learn",
    "matplotlib",
    "shap",
    "treelite"
]

gpu = [
  "cupy",
]


[project.urls]
Homepage = "https://github.com/ron-wettenstein/woodelf"
